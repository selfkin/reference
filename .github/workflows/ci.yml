# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest -v
      - name: Run demo
        run: python -m selfkin_ref.demo
      - name: No em or en dashes
        run: |
          if grep -rnI -e $'\xe2\x80\x94' -e $'\xe2\x80\x93' --exclude-dir=.git .; then
            echo "Found em or en dashes"; exit 1
          fi

  lowest:
    name: Tests with the lowest supported dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install the declared minimum versions
        run: |
          pip install "cryptography==42.0.0" "cbor2==6.1.0" "jsonschema==4.18.0" "referencing==0.30.0" "pytest==8.0.0"
          pip install --no-deps -e .
      - name: Run tests
        run: pytest -q

  interop:
    name: Interop with selfkin/standards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selfkin/standards
          path: standards
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[test]"
          pip install -r standards/tools/validate/requirements.txt
      - name: Demo documents pass the upstream validator
        env:
          SELFKIN_STANDARDS: standards
        run: pytest -v tests/test_upstream_validator.py
      - name: Export demo documents
        run: python -m selfkin_ref.demo --no-report --export out
      - name: Validate exported documents with the upstream CLI
        run: python standards/tools/validate/validate.py out/*.json
      - name: Vendored schemas match upstream main (informational)
        continue-on-error: true
        run: python scripts/vendor_schemas.py standards --check

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "Commit $sha has no Signed-off-by line"; status=1
            fi
          done
          exit $status

  audit:
    name: Dependency and static security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[test]"
          pip install pip-audit bandit
      - name: Known vulnerabilities in installed dependencies (pip-audit)
        run: pip-audit --skip-editable
      - name: Static analysis of the package (bandit)
        run: bandit -q -r src
