[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "selfkin-ref"
version = "0.1.0.dev0"
description = "Draft reference implementation of the Selfkin open standards (not for production)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The Selfkin reference contributors" }]
keywords = ["selfkin", "personal-ai", "capability-tokens", "reference-implementation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=42",
    "cbor2>=5.6",
    "jsonschema>=4.18",
    "referencing>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Standards = "https://github.com/selfkin/standards"
Source = "https://github.com/selfkin/reference"
Issues = "https://github.com/selfkin/reference/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"selfkin_ref.schema_files" = ["*.schema.json", "SOURCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
